<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Two stores, one power block</title>
    <!-- Static version of streamlit_app.py for GitHub Pages: Streamlit runs in the browser (stlite, Pyodide) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";
      mount(
        {
          requirements: ["matplotlib", "pandas", "numpy"],
          entrypoint: "streamlit_app.py",
          files: {
            "streamlit_app.py": { url: "./streamlit_app.py" },
            "nomogram.py": { url: "./nomogram.py" },
            "data/multiHorizonStorageExploration.csv": { url: "./data/multiHorizonStorageExploration.csv" },
            "fonts/LiberationSans-Regular.ttf": { url: "./fonts/LiberationSans-Regular.ttf" },
            "fonts/LiberationSans-Bold.ttf": { url: "./fonts/LiberationSans-Bold.ttf" },
          },
          streamlitConfig: { "client.toolbarMode": "viewer", "theme.base": "light" },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
